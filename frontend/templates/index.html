<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaWise — Water Conservation Recommendation System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            padding: 2rem;
        }
        .badge {
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 2.75rem;
            margin: 0.5rem 0;
            color: #0f172a;
        }
        p {
            font-size: 1.15rem;
            color: #64748b;
            max-width: 600px;
            line-height: 1.6;
        }
        .status-box {
            margin-top: 2rem;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 1.25rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <div class="hero">
        <span class="badge">AquaWise Platform</span>
        <h1>Understand Your Water. Change Your Habits.</h1>
        <p>A smart water conservation recommendation system designed for households and agricultural users.</p>
        <div class="status-box">
            <span class="status-indicator"></span>
            <strong>Phase 1 Initialized:</strong> Project Skeleton, Configuration & Health Check Ready.
        </div>
    </div>
</body>
</html>
